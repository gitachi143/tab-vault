<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tab Vault</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="hdr">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <span class="title">Tab Vault</span>
      <span class="profile-chip" id="profile-chip" title="This profile's vault is independent">–</span>
    </div>
    <button id="open-dashboard" class="icon-btn" title="Open history dashboard" aria-label="Open history">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path fill="currentColor" d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42 9.3-9.29H14V3zM5 5h6v2H5v12h12v-6h2v8H3V5h2z"/>
      </svg>
    </button>
  </header>

  <section class="stats" id="stats" aria-live="polite">
    <div class="stat"><span class="num" data-stat="tabs">–</span><span class="lbl">tabs</span></div>
    <div class="stat"><span class="num" data-stat="windows">–</span><span class="lbl">windows</span></div>
    <div class="stat"><span class="num" data-stat="groups">–</span><span class="lbl">groups</span></div>
    <div class="stat"><span class="num" data-stat="pinned">–</span><span class="lbl">pinned</span></div>
  </section>

  <section class="actions">
    <button id="save-now" class="primary">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M17 3H5a2 2 0 0 0-2 2v14l4-2 4 2 4-2 4 2V5a2 2 0 0 0-2-2zm0 13.27-2-1-4 2-4-2-2 1V5h12v11.27z"/></svg>
      Save snapshot
    </button>
    <button id="see-all" class="ghost">View history →</button>
  </section>

  <section class="recent">
    <div class="recent-head">
      <span>Recent</span>
      <button id="refresh" class="link-btn" title="Refresh">Refresh</button>
    </div>
    <ul id="recent-list" class="recent-list"></ul>
  </section>

  <footer class="ftr">
    <div class="ftr-row">
      <span class="ftr-l" id="last-saved">No snapshots yet</span>
      <span class="ftr-r" id="usage">–</span>
    </div>
    <div class="observer-note">Observer only — Tab Vault never opens tabs.</div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="popup.js"></script>
</body>
</html>
